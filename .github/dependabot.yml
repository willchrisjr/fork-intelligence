version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      pnpm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # eslint-config-next@16 still pulls eslint-plugin-react that calls
      # removed context.getFilename(); peers cap at ESLint 9. See #63.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Table v9 requires an opt-in features / useTable migration of
      # fork-table.tsx. Lockfile-only bumps fail typecheck. See #65.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /services/platform
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
